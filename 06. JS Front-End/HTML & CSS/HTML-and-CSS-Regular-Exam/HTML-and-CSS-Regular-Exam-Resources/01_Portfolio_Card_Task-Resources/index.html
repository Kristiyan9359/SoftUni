<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Portfolio Card</title>
</head>

<body>
    <div class="card">
        <div class="nav">
            <div class="logo">JOHN.DOE</div>
            <div class="links">
                <a>Home</a>
                <a>Projects</a>
                <a>Skills</a>
                <a>Blog</a>
                <a>Contact</a>
            </div>
            <div class="social">
                <img src="images/GitHub.png" alt="">
                <img src="images/Dribbble.png" alt="">
                <img src="images/Instagram.png" alt="">
            </div>
        </div>
        <div class="hero">
            <div class="text">
                <h1>John Doe</h1>
                <p>
                    Available for freelance projects and collaborations.
                    I bring ideas to life through thoughtful design and clean code.
                </p>
                <button>View My Work &gt;</button>
            </div>
            <img class="profile" src="images/profile_350x350.png" alt="">
        </div>
        <div class="trusted">
            <p>Trusted by:</p>
            <div class="logos">
                <div><img src="images/notion logo.png" alt=""></div>
                <div><img src="images/figma logo.png" alt=""></div>
                <div><img src="images/webflow logo.png" alt=""></div>
                <div><img src="images/framer logo.png" alt=""></div>
                <div><img src="images/adobe logo.png" alt=""></div>
            </div>
        </div>
    </div>
</body>

</html>
