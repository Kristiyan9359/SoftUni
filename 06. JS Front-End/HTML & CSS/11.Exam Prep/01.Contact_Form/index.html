<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="wrapper">

    <div class="left">

        <h2>GET IN TOUCH</h2>

        <form>

            <div class="row">
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
            </div>

            <textarea placeholder="Message"></textarea>

            <button>SEND</button>

        </form>

        <div class="footer">
            <span>© Untitled. All rights reserved</span>
            <span>Design: <a href="#">HTML & CSS</a></span>
        </div>

    </div>

    <div class="right">

        <h2>FOLLOW</h2>

        <div class="icons">

            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>

            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-pinterest-p"></i></a>
            <a href="#"><i class="fa-brands fa-threads"></i></a>
            <a href="#"><i class="fa-solid fa-phone"></i></a>

            <a href="#"><i class="fa-solid fa-envelope"></i></a>

        </div>

    </div>

</section>

</body>
</html>
