<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="justify-content.css">
    <title>Document</title>
</head>

<body>
    <h1>justify-content</h1>

    <h6>justify-content: flex-start; (default)</h6>
    <div class="flex-container justify-content-flex-start">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h6>justify-content: center;</h6>
    <div class="flex-container justify-content-center">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h6>justify-content: flex-end;</h6>
    <div class="flex-container justify-content-flex-end">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h6>justify-content: space-between;</h6>
    <div class="flex-container justify-content-space-between">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h6>justify-content: space-around;</h6>
    <div class="flex-container justify-content-space-around">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <h6>justify-content: space-evenly;</h6>
    <div class="flex-container justify-content-space-evenly">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>
</body>

</html>
